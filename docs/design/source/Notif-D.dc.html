<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notificaciones escritorio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position:relative;min-height:900px;overflow:hidden;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;{{themeVars}}">

<header style="position:relative;z-index:3;border-bottom:1px solid var(--border);background:var(--bg)">
<div style="max-width:1216px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:16px">
<div style="display:flex;align-items:center;gap:10px;flex:1">
<span aria-hidden="true" style="width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A1.5 1.5 0 0 1 6.5 5H15"/></svg></span>
<span style="font-size:22px;font-weight:800;letter-spacing:-0.03em">copy-pastas</span>
</div>
<button type="button" style="height:46px;padding:0 20px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Publicar</button>

<div style="position:relative">
<button type="button" aria-label="Notificaciones" aria-expanded="true" style="position:relative;width:46px;height:46px;border-radius:50%;border:2px solid var(--vote);box-sizing:border-box;background:var(--surface2);color:var(--ink);display:flex;align-items:center;justify-content:center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg></button>

<section role="dialog" aria-label="Notificaciones" style="position:absolute;top:58px;right:-52px;width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 16px 48px rgba(0,0,0,0.45);overflow:hidden">
<span aria-hidden="true" style="position:absolute;top:-7px;right:62px;width:14px;height:14px;background:var(--surface);border-left:1px solid var(--border);border-top:1px solid var(--border);transform:rotate(45deg)"></span>

<div style="display:flex;align-items:center;gap:8px;padding:14px 16px 6px 16px">
<h2 style="margin:0;flex:1;font-size:19px;font-weight:800;letter-spacing:-0.015em;display:flex;align-items:center;gap:8px">Notificaciones<sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent)">{{unreadCount}}</span></sc-if></h2>
<button type="button" onClick="{{markAll}}" style="height:44px;padding:0 10px;border:0;background:transparent;color:var(--vote);font-size:14px;font-weight:700;cursor:pointer">Marcar leídas</button>
</div>

<div role="tablist" style="display:flex;gap:8px;padding:0 16px 10px 16px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height:40px;padding:0 16px;border-radius:999px;border:0;font-size:14px;font-weight:700;cursor:pointer;{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<ul style="list-style:none;margin:0;padding:0;border-top:1px solid var(--border)">
<sc-for list="{{list}}" as="n" hint-placeholder-count="5">
<li style="border-bottom:1px solid var(--border)">
<a href="#" onClick="{{n.read}}" style="display:flex;gap:12px;align-items:flex-start;padding:14px 16px;min-height:44px;{{n.bg}}">
<span aria-hidden="true" style="flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;{{n.tile}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"/></svg></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:14.5px;line-height:1.35;font-weight:{{n.weight}}">{{n.text}}</span>
<span style="font-size:12.5px;color:var(--muted)">{{n.time}}</span>
</span>
<sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}"><span aria-label="Sin leer" style="flex:none;margin-top:6px;width:10px;height:10px;border-radius:50%;background:var(--vote)"></span></sc-if>
</a>
</li>
</sc-for>
</ul>

<a href="#" style="display:flex;align-items:center;justify-content:center;height:52px;font-size:15px;font-weight:700;color:var(--ink)">Ver todas</a>
</section>
</div>

<span style="width:46px;height:46px;display:flex;align-items:center;justify-content:center"><span style="width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 70% 25%, #FFF3B0 0 16%, transparent 17%), linear-gradient(140deg, #FF5CA8, #7F5BFF)"></span></span>
</div>
</header>

<div aria-hidden="true" style="max-width:1216px;margin:0 auto;padding:24px 32px;box-sizing:border-box;display:flex;gap:32px;justify-content:center">
<div style="flex:0 0 200px;display:flex;flex-direction:column;gap:8px"><div style="height:46px;border-radius:14px;background:var(--surface)"></div><div style="height:46px;border-radius:14px;background:var(--surface)"></div><div style="height:46px;border-radius:14px;background:var(--surface)"></div></div>
<div style="flex:1;max-width:640px;display:flex;flex-direction:column;gap:14px"><div style="height:240px;border-radius:20px;background:var(--surface)"></div><div style="height:240px;border-radius:20px;background:var(--surface)"></div><div style="height:240px;border-radius:20px;background:var(--surface)"></div></div>
<div style="flex:0 0 280px;height:260px;border-radius:20px;background:var(--surface)"></div>
</div>
<div aria-hidden="true" style="position:absolute;left:0;right:0;top:71px;bottom:0;z-index:2;background:var(--scrim)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true}}'>
const PAL = {
  light: {bg:'#F3F2FF', surface:'#FFFFFF', surface2:'#EAE8FB', ink:'#15132B', muted:'#55527C', border:'#DAD7F3', accent:'#1B1740', 'on-accent':'#C6F432', vote:'#5B2EFF', scrim:'rgba(21,19,43,0.35)', unread:'rgba(91,46,255,0.07)',
    t1bg:'#CFF5E3', t1fg:'#0B5A3C', t2bg:'#FFE0C9', t2fg:'#8A3A07', t3bg:'#E0D9FF', t3fg:'#40259E', t4bg:'#FAF0B5', t4fg:'#5E4D00', t5bg:'#FFD9EA', t5fg:'#99245F'},
  dark: {bg:'#0E0D1A', surface:'#17162A', surface2:'#211F3A', ink:'#F1F0FF', muted:'#A5A2D0', border:'#2A2847', accent:'#C6F432', 'on-accent':'#0E0D1A', vote:'#C6F432', scrim:'rgba(5,4,14,0.6)', unread:'rgba(198,244,50,0.06)',
    t1bg:'#12392F', t1fg:'#6DF0B8', t2bg:'#4A2410', t2fg:'#FFB070', t3bg:'#2B2263', t3fg:'#B9A8FF', t4bg:'#433A0A', t4fg:'#F5E26B', t5bg:'#4A1634', t5fg:'#FF9CCB'}
};
const N = [
  {id:1, slot:4, icon:'M4 18l-1-11 5 4 4-7 4 7 5-4-1 11z', text:'Has desbloqueado «Archivero».', time:'hace 5 min', unread:true},
  {id:2, slot:1, icon:'M9 9h11v11H9zM5 15V6.5A1.5 1.5 0 0 1 6.5 5H15', text:'«Aviso urgente sobre el táper de la nevera» ha llegado a 2.000 copias.', time:'hace 1 h', unread:true},
  {id:3, slot:3, icon:'M12 19V6M6 11l6-6 6 6', text:'lola.exe y 24 personas más han votado «Carta de amor a mi router».', time:'hace 3 h', unread:true},
  {id:4, slot:5, icon:'M6.5 4h11a1 1 0 0 1 1 1v15l-6.5-4.5L5.5 20V5a1 1 0 0 1 1-1z', text:'Alguien ha guardado «Carta de baja de un grupo de WhatsApp» en una carpeta.', time:'ayer', unread:false},
  {id:5, slot:2, icon:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z', text:'Hay una copy-pasta nueva en #humor, una de tus etiquetas favoritas.', time:'ayer', unread:false},
  {id:6, slot:1, icon:'M12 15V3M7 8l5-5 5 5M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6', text:'«El gato que te mira mientras copias» se ha compartido 20 veces.', time:'hace 2 días', unread:false}
];
class Component extends DCLogic {
  state = {tab:'all', read:{}};
  renderVals() {
    const dark = this.props.dark ?? true;
    const p = dark ? PAL.dark : PAL.light;
    const themeVars = Object.keys(p).map((k) => '--' + k + ':' + p[k]).join(';');
    const isUnread = (n) => n.unread && !this.state.read[n.id];
    const unreadCount = N.filter(isUnread).length;
    const items = N.filter((n) => this.state.tab === 'all' || isUnread(n)).map((n) => ({
      icon:n.icon, text:n.text, time:n.time, unread:isUnread(n), weight: isUnread(n) ? '700' : '500',
      tile:'background:var(--t' + n.slot + 'bg);color:var(--t' + n.slot + 'fg)', bg: isUnread(n) ? 'background:var(--unread)' : '',
      read:(e) => { if (e && e.preventDefault) e.preventDefault(); const r = Object.assign({}, this.state.read); r[n.id] = true; this.setState({read:r}); }
    }));
    const tabs = [['all','Todas'],['unread','Sin leer']].map((t) => ({label:t[1], on:this.state.tab === t[0], pick:() => this.setState({tab:t[0]}),
      style: this.state.tab === t[0] ? 'background:var(--accent);color:var(--on-accent)' : 'background:var(--surface2);color:var(--ink)'}));
    return {themeVars, list:items, tabs, unreadCount, hasUnread:unreadCount > 0,
      markAll:() => { const r = {}; N.forEach((n) => { r[n.id] = true; }); this.setState({read:r}); }};
  }
}
</script>
</body>
</html>
