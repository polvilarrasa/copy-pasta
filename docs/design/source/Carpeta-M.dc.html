<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carpeta móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
input::placeholder{color:var(--muted);opacity:1}
</style>
</helmet>
<div style="width:390px;min-height:1900px;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;display:flex;flex-direction:column;{{themeVars}}">

<header style="display:flex;align-items:center;gap:4px;padding:8px 8px 8px 8px">
<button type="button" aria-label="Volver a carpetas" style="width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<h1 style="margin:0;flex:1;font-size:17px;font-weight:800">Carpeta</h1>
<button type="button" aria-label="Más opciones de la carpeta" style="width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
</header>

<section style="display:flex;flex-direction:column;gap:14px;padding:12px 16px 8px 16px">
<div style="display:flex;gap:14px;align-items:center">
<span aria-hidden="true" style="flex:none;width:64px;height:64px;border-radius:20px;background:var(--t3bg);color:var(--t3fg);display:flex;align-items:center;justify-content:center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z"/></svg></span>
<div style="display:flex;flex-direction:column;gap:4px;min-width:0">
<h2 style="margin:0;font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-0.03em">Para el grupo</h2>
<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600">
<span>12 copy-pastas</span><span aria-hidden="true">·</span>
<span style="display:flex;align-items:center;gap:4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><path d="M6 11h12v9H6z"/></svg>Privada</span>
</div>
</div>
</div>
<p style="margin:0;font-size:15px;line-height:1.5;color:var(--muted)">Las que mando cuando alguien tarda en contestar.</p>
<div style="display:flex;gap:8px">
<button type="button" style="flex:1;height:48px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>Compartir carpeta</button>
<button type="button" style="height:48px;padding:0 20px;border:1px solid var(--border);border-radius:14px;background:transparent;color:var(--ink);font-size:15px;font-weight:700;cursor:pointer">Editar</button>
</div>
</section>

<div style="padding:12px 16px 8px 16px">
<label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar en la carpeta</label>
<div style="display:flex;align-items:center;gap:10px;height:48px;box-sizing:border-box;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 18px;color:var(--muted)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
<input id="q" type="search" placeholder="Buscar en esta carpeta" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink)">
</div>
</div>

<main style="display:flex;flex-direction:column;gap:14px;padding:8px 16px 40px 16px">
<sc-for list="{{items}}" as="c" hint-placeholder-count="3">
<dc-import name="Card" item="{{c}}" dark="{{dark}}" hint-size="100%,540px"></dc-import>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true}}'>
const PAL = {
  light: {bg:'#F3F2FF', surface:'#FFFFFF', surface2:'#EAE8FB', ink:'#15132B', muted:'#55527C', border:'#DAD7F3', accent:'#1B1740', 'on-accent':'#C6F432', t3bg:'#E0D9FF', t3fg:'#40259E'},
  dark: {bg:'#0E0D1A', surface:'#17162A', surface2:'#211F3A', ink:'#F1F0FF', muted:'#A5A2D0', border:'#2A2847', accent:'#C6F432', 'on-accent':'#0E0D1A', t3bg:'#2B2263', t3fg:'#B9A8FF'}
};
const ITEMS = [
  {saved:true, title:'Carta de amor a mi router', author:'lola.exe', hue:200, ach:'Primera de la clase', score:1800, tags:['humor','tecnología'],
   body:'Querido router:\nSé que no hablamos mucho, pero siempre estás ahí, parpadeando.\nHoy me has dejado sin wifi justo cuando iba a ganar la partida.\nNo te guardo rencor. Bueno, un poco sí.\nTengo tu cable en una mano y el manual en la otra.\nDame una señal.\nCualquiera.\nAtentamente, tu usuario más paciente'},
  {saved:true, template:true, title:'Carta de baja de un grupo de WhatsApp', author:'wifi_de_vecino', hue:290, ach:'Rey del copy', score:962, tags:['chat','plantillas'],
   body:'Estimado grupo «[NOMBRE DEL GRUPO]»:\nTras [NÚMERO] meses de silencio, 3.412 audios de cuatro minutos y un meme que nadie entendió, comunico mi salida.\nNo es por ti, es por las notificaciones.\nSi alguien me necesita, estaré mirando el móvil igualmente.\nUn abrazo,\n[TU NOMBRE]'},
  {saved:true, ascii:true, title:'El gato que te mira mientras copias', author:'paco_nocturno', hue:20, ach:'Maestro del Ctrl+V', score:4210, tags:['ascii','wholesome'],
   body:' /\\_/\\\n( o.o )\n > ^ <\n /   \\\n(__ __)'}
];
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const p = dark ? PAL.dark : PAL.light;
    const themeVars = Object.keys(p).map((k) => '--' + k + ':' + p[k]).join(';');
    return {themeVars, dark, items:ITEMS};
  }
}
</script>
</body>
</html>
