<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Estados vacíos móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width:390px;min-height:1800px;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;display:flex;flex-direction:column;gap:36px;padding:24px 16px 40px 16px;{{themeVars}}">

<sc-for list="{{states}}" as="s" hint-placeholder-count="3">
<section style="display:flex;flex-direction:column;gap:10px">
<h2 style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)">{{s.caption}}</h2>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden">

<sc-if value="{{s.search}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:10px;padding:14px 14px 0 14px">
<div style="display:flex;align-items:center;gap:10px;height:48px;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:0 18px;color:var(--ink);font-size:16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
<span style="flex:1">gatos pirata</span>
<span aria-hidden="true" style="color:var(--muted)">✕</span>
</div>
<div style="display:flex;gap:8px"><span style="font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--t2bg);color:var(--t2fg)">#humor</span><span style="font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--t3bg);color:var(--t3fg)">#gaming</span></div>
</div>
</sc-if>

<sc-if value="{{s.frame}}" hint-placeholder-val="{{ false }}">
<div style="padding:14px 16px;border-bottom:1px solid var(--border);font-size:19px;font-weight:800;letter-spacing:-0.015em">Notificaciones</div>
</sc-if>

<div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 24px 28px 24px;text-align:center">
<pre aria-hidden="true" style="margin:0;padding:14px 22px;border-radius:16px;background:var(--surface2);color:var(--muted);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15px;line-height:1.3;text-align:left">{{s.art}}</pre>
<h3 style="margin:6px 0 0 0;font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-0.02em;text-wrap:balance">{{s.title}}</h3>
<p style="margin:0;font-size:15px;line-height:1.5;color:var(--muted);text-wrap:pretty;max-width:300px">{{s.text}}</p>
<div style="display:flex;flex-direction:column;gap:8px;width:100%;margin-top:6px">
<button type="button" style="height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:800;cursor:pointer">{{s.primary}}</button>
<sc-if value="{{s.secondary}}" hint-placeholder-val="{{ false }}"><button type="button" style="height:48px;border:1px solid var(--border);border-radius:14px;background:transparent;color:var(--ink);font-size:15px;font-weight:700;cursor:pointer">{{s.secondary}}</button></sc-if>
</div>
</div>
</div>
</section>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true}}'>
const PAL = {
  light: {bg:'#F3F2FF', surface:'#FFFFFF', surface2:'#EAE8FB', ink:'#15132B', muted:'#55527C', border:'#DAD7F3', accent:'#1B1740', 'on-accent':'#C6F432',
    t2bg:'#FFE0C9', t2fg:'#8A3A07', t3bg:'#E0D9FF', t3fg:'#40259E'},
  dark: {bg:'#0E0D1A', surface:'#17162A', surface2:'#211F3A', ink:'#F1F0FF', muted:'#A5A2D0', border:'#2A2847', accent:'#C6F432', 'on-accent':'#0E0D1A',
    t2bg:'#4A2410', t2fg:'#FFB070', t3bg:'#2B2263', t3fg:'#B9A8FF'}
};
const STATES = [
  {caption:'Feed sin resultados', search:true, art:'  /\\_/\\\n ( ?.? )\n  > ^ <', title:'No hay nada para «gatos pirata»', text:'Prueba con otra palabra o quita algún filtro. A veces la mejor copy-pasta está en otra etiqueta.', primary:'Limpiar filtros', secondary:'Publicar la primera'},
  {caption:'Carpeta vacía', art:' .-------.\n |       |\n \'-------\'', title:'Esta carpeta está vacía', text:'Usa el botón Guardar en cualquier copy-pasta y aparecerá aquí.', primary:'Explorar el feed'},
  {caption:'Sin notificaciones', frame:true, art:'  z Z z\n (-.-) ', title:'Todo al día', text:'Cuando alguien vote, guarde o copie tus copy-pastas, lo verás aquí.', primary:'Publicar una copy-pasta'}
];
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const p = dark ? PAL.dark : PAL.light;
    const themeVars = Object.keys(p).map((k) => '--' + k + ':' + p[k]).join(';');
    return {themeVars, states:STATES};
  }
}
</script>
</body>
</html>
