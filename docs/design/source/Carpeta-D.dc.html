<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carpeta escritorio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
input::placeholder{color:var(--muted);opacity:1}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="min-height:1500px;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;{{themeVars}}">

<header style="border-bottom:1px solid var(--border)">
<div style="max-width:1216px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:16px">
<div style="display:flex;align-items:center;gap:10px;flex:1">
<span aria-hidden="true" style="width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A1.5 1.5 0 0 1 6.5 5H15"/></svg></span>
<span style="font-size:22px;font-weight:800;letter-spacing:-0.03em">copy-pastas</span>
</div>
<a href="#" style="height:44px;padding:0 16px;display:flex;align-items:center;font-size:15px;font-weight:700;color:var(--muted)">Volver al feed</a>
</div>
</header>

<div style="max-width:1216px;margin:0 auto;padding:28px 32px 56px 32px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">

<nav aria-label="Tus carpetas" style="flex:0 0 240px;display:flex;flex-direction:column;gap:4px">
<h2 style="margin:0 0 8px 8px;font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)">Tus carpetas</h2>
<sc-for list="{{folders}}" as="f" hint-placeholder-count="4">
<a href="#" style="display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:14px;font-size:15px;font-weight:700;{{f.style}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z"/></svg>
<span style="flex:1">{{f.name}}</span><span style="font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)">{{f.count}}</span></a>
</sc-for>
<button type="button" style="margin-top:8px;height:46px;border:1.5px dashed var(--border);border-radius:14px;background:transparent;color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nueva carpeta</button>
</nav>

<main style="flex:999 1 520px;max-width:720px;min-width:0;display:flex;flex-direction:column;gap:20px">

<section style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px">
<span aria-hidden="true" style="flex:none;width:72px;height:72px;border-radius:22px;background:var(--t3bg);color:var(--t3fg);display:flex;align-items:center;justify-content:center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z"/></svg></span>
<div style="flex:1 1 240px;display:flex;flex-direction:column;gap:4px;min-width:0">
<h1 style="margin:0;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-0.03em">Para el grupo</h1>
<p style="margin:0;font-size:15px;line-height:1.5;color:var(--muted)">Las que mando cuando alguien tarda en contestar.</p>
<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600">
<span>12 copy-pastas</span><span aria-hidden="true">·</span>
<span style="display:flex;align-items:center;gap:4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><path d="M6 11h12v9H6z"/></svg>Privada</span>
</div>
</div>
<div style="display:flex;gap:8px">
<button type="button" style="height:48px;padding:0 20px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;cursor:pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>Compartir carpeta</button>
<button type="button" style="height:48px;padding:0 20px;border:1px solid var(--border);border-radius:14px;background:transparent;color:var(--ink);font-size:15px;font-weight:700;cursor:pointer">Editar</button>
</div>
</section>

<div>
<label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar en la carpeta</label>
<div style="display:flex;align-items:center;gap:10px;height:48px;box-sizing:border-box;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 18px;color:var(--muted)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
<input id="q" type="search" placeholder="Buscar en esta carpeta" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink)">
</div>
</div>

<sc-for list="{{items}}" as="c" hint-placeholder-count="3">
<dc-import name="Card" item="{{c}}" dark="{{dark}}" hint-size="100%,540px"></dc-import>
</sc-for>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true}}'>
const PAL = {
  light: {bg:'#F3F2FF', surface:'#FFFFFF', surface2:'#EAE8FB', ink:'#15132B', muted:'#55527C', border:'#DAD7F3', accent:'#1B1740', 'on-accent':'#C6F432', t3bg:'#E0D9FF', t3fg:'#40259E'},
  dark: {bg:'#0E0D1A', surface:'#17162A', surface2:'#211F3A', ink:'#F1F0FF', muted:'#A5A2D0', border:'#2A2847', accent:'#C6F432', 'on-accent':'#0E0D1A', t3bg:'#2B2263', t3fg:'#B9A8FF'}
};
const ITEMS = [
  {saved:true, title:'Carta de amor a mi router', author:'lola.exe', hue:200, ach:'Primera de la clase', score:1800, tags:['humor','tecnología'],
   body:'Querido router:\nSé que no hablamos mucho, pero siempre estás ahí, parpadeando.\nHoy me has dejado sin wifi justo cuando iba a ganar la partida.\nNo te guardo rencor. Bueno, un poco sí.\nTengo tu cable en una mano y el manual en la otra.\nDame una señal.\nCualquiera.\nAtentamente, tu usuario más paciente'},
  {saved:true, template:true, title:'Carta de baja de un grupo de WhatsApp', author:'wifi_de_vecino', hue:290, ach:'Rey del copy', score:962, tags:['chat','plantillas'],
   body:'Estimado grupo «[NOMBRE DEL GRUPO]»:\nTras [NÚMERO] meses de silencio, 3.412 audios de cuatro minutos y un meme que nadie entendió, comunico mi salida.\nNo es por ti, es por las notificaciones.\nSi alguien me necesita, estaré mirando el móvil igualmente.\nUn abrazo,\n[TU NOMBRE]'},
  {saved:true, ascii:true, title:'El gato que te mira mientras copias', author:'paco_nocturno', hue:20, ach:'Maestro del Ctrl+V', score:4210, tags:['ascii','wholesome'],
   body:' /\\_/\\\n( o.o )\n > ^ <\n /   \\\n(__ __)'}
];
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const p = dark ? PAL.dark : PAL.light;
    const themeVars = Object.keys(p).map((k) => '--' + k + ':' + p[k]).join(';');
    const folders = [['Para el grupo',12],['Respuestas rápidas',8],['Clásicos',23],['Para reír en el curro',5]].map((f, i) => ({name:f[0], count:f[1],
      style: i === 0 ? 'background:var(--surface2);color:var(--ink)' : 'color:var(--muted)'}));
    return {themeVars, dark, items:ITEMS, folders};
  }
}
</script>
</body>
</html>
