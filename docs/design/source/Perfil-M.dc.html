<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Perfil móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width:390px;min-height:2300px;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;display:flex;flex-direction:column;{{themeVars}}">

<header style="display:flex;align-items:center;gap:4px;padding:8px 8px 8px 8px">
<button type="button" aria-label="Volver" style="width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<h1 style="margin:0;flex:1;font-size:17px;font-weight:800">Perfil</h1>
<button type="button" aria-label="Compartir perfil" style="width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg></button>
</header>

<section style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 16px 8px 16px;text-align:center">
<span aria-hidden="true" style="width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 70% 28%, rgba(255,255,255,0.85) 0 14%, transparent 15%), linear-gradient(140deg, hsl(20,85%,62%), hsl(80,80%,56%))"></span>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
<h2 style="margin:0;font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-0.03em">paco_nocturno</h2>
<span style="display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--surface2);color:var(--ach);font-size:13px;font-weight:700">Maestro del Ctrl+V</span>
<span style="font-size:13px;color:var(--muted)">Miembro desde marzo de 2025</span>
</div>
</section>

<section aria-label="Contadores" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:16px">
<sc-for list="{{counters}}" as="c" hint-placeholder-count="3">
<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px">
<span style="font-size:24px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums">{{c.value}}</span>
<span style="font-size:12.5px;color:var(--muted);font-weight:600">{{c.label}}</span>
</div>
</sc-for>
</section>

<div style="display:flex;flex-direction:column;gap:28px;padding:12px 16px 40px 16px">

<section style="display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px">Conseguidos<span style="font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)">6</span></h2>
<sc-for list="{{done}}" as="a" hint-placeholder-count="6">
<div style="display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px">
<span aria-hidden="true" style="flex:none;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;{{a.tile}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"/></svg></span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap">{{a.name}}<sc-if value="{{a.active}}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent)">Título activo</span></sc-if></span>
<span style="font-size:13.5px;color:var(--muted);line-height:1.4">{{a.desc}}</span>
<span style="font-size:12.5px;color:var(--muted);font-weight:600">{{a.date}}</span>
</div>
</div>
</sc-for>
</section>

<section style="display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px">Pendientes<span style="font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)">4</span></h2>
<sc-for list="{{todo}}" as="a" hint-placeholder-count="4">
<div style="display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px">
<span aria-hidden="true" style="flex:none;width:56px;height:56px;border-radius:16px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"/></svg></span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
<span style="font-size:16px;font-weight:800">{{a.name}}</span>
<span style="font-size:13.5px;color:var(--muted);line-height:1.4">{{a.desc}}</span>
<div style="display:flex;align-items:center;gap:10px">
<div role="progressbar" aria-valuemin="0" aria-valuemax="{{a.max}}" aria-valuenow="{{a.now}}" aria-label="{{a.name}}" style="flex:1;height:8px;border-radius:999px;background:var(--surface2);overflow:hidden"><div style="height:100%;border-radius:999px;background:var(--vote);width:{{a.pct}}"></div></div>
<span style="font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)">{{a.now}}/{{a.max}}</span>
</div>
</div>
</div>
</sc-for>
</section>

<section style="display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px">Secretos<span style="font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)">3</span></h2>
<sc-for list="{{secrets}}" as="a" hint-placeholder-count="3">
<div style="display:flex;gap:14px;align-items:center;border:1.5px dashed var(--border);border-radius:16px;padding:14px">
<span aria-hidden="true" style="flex:none;width:56px;height:56px;border-radius:16px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><path d="M6 11h12v9H6z"/></svg></span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:16px;font-weight:800;letter-spacing:0.08em">???</span>
<span style="font-size:13.5px;color:var(--muted);line-height:1.4">Logro secreto. Se desbloquea solo.</span>
</div>
</div>
</sc-for>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true}}'>
const PAL = {
  light: {bg:'#F3F2FF', surface:'#FFFFFF', surface2:'#EAE8FB', ink:'#15132B', muted:'#55527C', border:'#DAD7F3', accent:'#1B1740', 'on-accent':'#C6F432', vote:'#5B2EFF', ach:'#5B2EFF',
    t1bg:'#CFF5E3', t1fg:'#0B5A3C', t2bg:'#FFE0C9', t2fg:'#8A3A07', t3bg:'#E0D9FF', t3fg:'#40259E', t4bg:'#FAF0B5', t4fg:'#5E4D00', t5bg:'#FFD9EA', t5fg:'#99245F'},
  dark: {bg:'#0E0D1A', surface:'#17162A', surface2:'#211F3A', ink:'#F1F0FF', muted:'#A5A2D0', border:'#2A2847', accent:'#C6F432', 'on-accent':'#0E0D1A', vote:'#C6F432', ach:'#FF8EC4',
    t1bg:'#12392F', t1fg:'#6DF0B8', t2bg:'#4A2410', t2fg:'#FFB070', t3bg:'#2B2263', t3fg:'#B9A8FF', t4bg:'#433A0A', t4fg:'#F5E26B', t5bg:'#4A1634', t5fg:'#FF9CCB'}
};
const I = {
  star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
  bolt:'M13 3L5 13.5h6L10 21l8-10.5h-6z',
  moon:'M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z',
  flame:'M12 3c1 3.5 5 5 5 9.5a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.2 1 2 2 2-1-3 0-5 1-7.5z',
  folder:'M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z',
  globe:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18',
  crown:'M4 18l-1-11 5 4 4-7 4 7 5-4-1 11z'
};
const tile = (n) => 'background:var(--t' + n + 'bg);color:var(--t' + n + 'fg)';
const DONE = [
  {name:'Primer Ctrl+V', desc:'Publica tu primera copy-pasta.', date:'12 mar 2025', icon:I.star, tile:tile(1)},
  {name:'Maestro del Ctrl+V', desc:'100 copias en una misma copy-pasta.', date:'3 jun 2025', icon:I.crown, tile:tile(4), active:true},
  {name:'Madrugador', desc:'Publica entre las 4:00 y las 6:00.', date:'21 jun 2025', icon:I.moon, tile:tile(3)},
  {name:'Vecino ilustre', desc:'Una copy-pasta tuya en el top semanal.', date:'9 ago 2025', icon:I.flame, tile:tile(2)},
  {name:'Archivero', desc:'Guarda 10 copy-pastas en carpetas.', date:'2 sep 2025', icon:I.folder, tile:tile(5)},
  {name:'Políglota', desc:'Publica en 3 etiquetas distintas.', date:'18 sep 2025', icon:I.globe, tile:tile(1)}
];
const TODO = [
  {name:'Rey del copy', desc:'Publica 50 copy-pastas.', now:37, max:50, icon:I.crown},
  {name:'Centenario', desc:'100 votos positivos en una sola copy-pasta.', now:62, max:100, icon:I.bolt},
  {name:'Coleccionista', desc:'Crea 10 carpetas.', now:3, max:10, icon:I.folder},
  {name:'Imparable', desc:'Publica 7 días seguidos.', now:4, max:7, icon:I.flame}
];
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const p = dark ? PAL.dark : PAL.light;
    const themeVars = Object.keys(p).map((k) => '--' + k + ':' + p[k]).join(';');
    return {themeVars, dark, done:DONE, secrets:[1,2,3],
      todo:TODO.map((t) => Object.assign({}, t, {pct:Math.round(t.now / t.max * 100) + '%'})),
      counters:[{value:'48', label:'Publicadas'},{value:'12,4k', label:'Copias'},{value:'8,9k', label:'Puntos'}]};
  }
}
</script>
</body>
</html>
