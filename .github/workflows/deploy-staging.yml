name: deploy-staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push the image
        id: meta
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image="${IMAGE,,}:${GITHUB_SHA}"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --tag "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    # Runs only once the staging host is configured in the repository variables and secrets.
    needs: image
    if: vars.STAGING_HOST != ''
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Install the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull the image and restart the stack
        # Migrations run inside the app container on start (RUN_MIGRATIONS=true in the staging compose file).
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.STAGING_USER }}@${{ vars.STAGING_HOST }}" \
            "cd ${{ vars.STAGING_PATH }} && export APP_IMAGE='$IMAGE' && docker compose -f compose.staging.yaml pull app && docker compose -f compose.staging.yaml up -d && docker image prune -f"
