name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: copypastas
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail -d copypastas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: copypastas
      DB_USERNAME: sail
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for large files in the commits
        # Fails when a commit adds a file over 1 MB that is not justified in .github/large-files-allowed.txt.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against, skipping."
          else
            bash .github/scripts/check-large-files.sh "$BASE_SHA" "$GITHUB_SHA"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist
          cp -n .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Install JS dependencies
        run: npm ci

      - name: Build the frontend assets
        # The browser tests render real pages, so the Vite manifest must exist before they run.
        run: npm run build

      - name: Install the browser for browser tests
        run: npx playwright install --with-deps chromium

      - name: Create testing database
        run: PGPASSWORD=password psql -h 127.0.0.1 -U sail -d copypastas -c "CREATE DATABASE testing;"

      - name: Run CI Checks
        run: composer ci:check
