# Staging stack. The env file lives on the host next to this file and is never committed.
# Set APP_IMAGE to the image built by the deploy workflow, or leave it unset to build locally.
services:
    app:
        image: ${APP_IMAGE:-copypastas:staging}
        build: .
        env_file: .env.staging
        environment:
            SERVER_NAME: ${SERVER_NAME:-:8080}
            REDIS_HOST: redis
        ports:
            - '${APP_PORT:-8080}:8080'
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    worker:
        image: ${APP_IMAGE:-copypastas:staging}
        env_file: .env.staging
        environment:
            REDIS_HOST: redis
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=90', '--sleep=3', '--max-time=3600']
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    scheduler:
        image: ${APP_IMAGE:-copypastas:staging}
        env_file: .env.staging
        environment:
            REDIS_HOST: redis
        command: ['sh', '-c', 'while true; do php artisan schedule:run --no-interaction; sleep 60; done']
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    pgsql:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-copypastas}
            POSTGRES_USER: ${DB_USERNAME:-sail}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-sail} -d ${DB_DATABASE:-copypastas}']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redisdata:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    backup:
        image: postgres:18-alpine
        environment:
            PGHOST: pgsql
            PGUSER: ${DB_USERNAME:-sail}
            PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
            PGDATABASE: ${DB_DATABASE:-copypastas}
        volumes:
            - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
            - backups:/backups
        entrypoint: ['sh', '/usr/local/bin/backup.sh']
        depends_on:
            pgsql:
                condition: service_healthy
        restart: unless-stopped

volumes:
    pgdata:
    redisdata:
    backups:
